name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --all-targets
      - name: Test
        run: cargo test

  codegen-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin the toolchain so rustfmt output matches the toolchain used to generate the committed src/
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build fin-protoc
        run: |
          git clone --depth 1 https://github.com/xinchentechnote/fin-protoc.git /tmp/fin-protoc
          cd /tmp/fin-protoc && go build -o /tmp/bin/fin-protoc ./cmd
      - name: Regenerate src from DSL
        run: |
          /tmp/bin/fin-protoc -f proto/risk_v0.1.0.pdsl -r src/
          cargo fix --allow-dirty --allow-staged --all-targets
          cargo fmt
      - name: Fail if generated code drifted
        run: |
          if ! git diff --exit-code -- src/; then
            echo "::error::src/ does not match fin-protoc output for proto/*.pdsl. Run 'make compile' locally and commit the result."
            exit 1
          fi
